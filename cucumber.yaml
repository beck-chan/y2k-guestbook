default:
  requireModule:
    - tsx/cjs
  require:
    - features/support/**/*.ts
    - features/step_definitions/**/*.ts
  format:
    - progress-bar
    - html:features/reports/results.html
  formatOptions:
    snippetInterface: async-await
  worldParameters:
    baseUrl: http://localhost:3000
    guestbookPath: /
    adminPath: /admin

# Named profiles replace `default` (they do not inherit)
admin:
  requireModule:
    - tsx/cjs
  require:
    - features/support/**/*.ts
    - features/step_definitions/**/*.ts
  format:
    - progress-bar
    - html:features/reports/admin.html
  formatOptions:
    snippetInterface: async-await
  worldParameters:
    baseUrl: http://localhost:3000
    guestbookPath: /
    adminPath: /admin
